# nginx config baked into the container image (see Dockerfile). Serves the site folder as-is, the way GitHub Pages
# does: folder-style URLs, /why redirects to /why/, no rewrites. Runs as UID 101 on port 8080 and writes only to /tmp
# (pid file and temp dirs), so a pod can run with readOnlyRootFilesystem and an emptyDir mounted at /tmp.

# Fixed, not auto: auto counts the node's CPUs, not the pod's limit. Scale with replicas instead.
worker_processes  2;
error_log  /dev/stderr  notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    client_body_temp_path  /tmp/client_temp;
    proxy_temp_path        /tmp/proxy_temp;
    fastcgi_temp_path      /tmp/fastcgi_temp;
    uwsgi_temp_path        /tmp/uwsgi_temp;
    scgi_temp_path         /tmp/scgi_temp;

    include  /etc/nginx/mime.types;
    # Types the stock list lacks: the per-page Markdown copies (rel=alternate, text/markdown) and api/v1/index.csv.
    types {
        text/markdown  md;
        text/csv       csv;
    }
    default_type   application/octet-stream;
    charset        utf-8;
    charset_types  text/plain text/css text/xml text/markdown text/csv application/rss+xml image/svg+xml;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /dev/stdout  main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    gzip             on;
    gzip_vary        on;
    # Compress behind proxies too: by default nginx skips any request carrying a Via header, which many load balancers add.
    gzip_proxied     any;
    gzip_comp_level  5;
    gzip_min_length  1024;
    gzip_types       text/plain text/css text/xml text/markdown text/csv application/json application/rss+xml image/svg+xml;

    # No file name carries a content hash, so nothing is cached as immutable. Pages, CSS and API data get ten minutes,
    # as on GitHub Pages; fonts and images, which rarely change, a day. Browsers revalidate with ETag after that.
    map $sent_http_content_type $cache_control {
        ~^font/   "public, max-age=86400";
        ~^image/  "public, max-age=86400";
        default   "public, max-age=600";
    }

    server {
        listen       8080 default_server;
        server_name  _;
        root         /srv/site;
        index        index.html;

        # Relative Location headers, so /why -> /why/ keeps the scheme and host the client used (TLS ends at the ingress).
        absolute_redirect  off;

        # A location that sets its own add_header drops all of these; none below does.
        add_header  Cache-Control            $cache_control;
        add_header  X-Content-Type-Options   nosniff always;
        add_header  Referrer-Policy          strict-origin-when-cross-origin always;
        add_header  Content-Security-Policy  "frame-ancestors 'none'" always;

        # For liveness and readiness probes.
        location = /healthz {
            access_log    off;
            default_type  text/plain;
            return        200 "ok\n";
        }

        # Files the pages link to that the extension table gets wrong: LICENSE has no extension,
        # and .ts maps to video/mp2t.
        location = /LICENSE {
            default_type  text/plain;
        }
        location ~ \.d\.ts$ {
            types         { }
            default_type  text/plain;
        }
    }
}
