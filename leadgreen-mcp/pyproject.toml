[project]
name = "leadgreen-mcp"
version = "0.2.0"
description = "MCP server for the Lead Green index: GPU energy per million output tokens, by model, GPU and configuration, with grid carbon."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["mcp>=1.2", "httpx>=0.27"]  # works on mcp 1.x and 2.x (guarded import in server.py)

[project.scripts]
leadgreen-mcp = "leadgreen_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license and license-files
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["leadgreen_mcp"]
