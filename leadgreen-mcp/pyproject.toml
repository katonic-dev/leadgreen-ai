[project]
name = "leadgreen-mcp"
version = "0.3.1"
description = "MCP server for the Lead Green index: GPU energy per million output tokens, by model, GPU and configuration, with grid carbon."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Prem Naraindas", email = "hello@leadgreen.ai" }]
maintainers = [{ name = "Lead Green, a Katonic project", email = "hello@leadgreen.ai" }]
keywords = [
  "mcp", "model-context-protocol", "llm", "inference", "energy", "watt-hours", "tokens",
  "gpu", "h100", "b200", "carbon", "sustainability", "ml-energy", "leadgreen",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["mcp>=1.2", "httpx>=0.27"]  # works on mcp 1.x and 2.x (guarded import in server.py)

[project.urls]
Homepage = "https://leadgreen.ai/"
Documentation = "https://leadgreen.ai/mcp/"
"Data API" = "https://leadgreen.ai/api/"
Changes = "https://leadgreen.ai/index/#changes"
Source = "https://github.com/katonic-dev/leadgreen-ai"
Issues = "https://github.com/katonic-dev/leadgreen-ai/issues"

[project.scripts]
leadgreen-mcp = "leadgreen_mcp.server:main"

[build-system]
requires = ["hatchling==1.32.4"]  # pinned so the wheel rebuilds byte for byte (publish-mcp.yml checks it); hatchling 1.27+ for PEP 639 license-files
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["leadgreen_mcp"]
